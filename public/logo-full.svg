    <rect x="696" y="552" width="12" height="34" rx="4" fill="#805035"/>
  </g>
  <!-- shrubs -->
  <path d="M245 559Q254 520 286 534Q298 505 325 529Q346 504 371 534Q397 520 416 552V603H245Z" fill="#4f9847"/>
  <path d="M608 564Q624 525 650 539Q670 506 694 535Q721 519 741 549Q766 533 788 566V610H608Z" fill="#438b42"/>
