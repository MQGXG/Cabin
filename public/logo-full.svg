<text x="512" y="858" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="600" letter-spacing="2.5" fill="#542a1b">LittleWoodHouse</text>
<path d="M247 841H299M725 841H777" stroke="#542a1b" stroke-width="4" stroke-linecap="round"/>
</svg>