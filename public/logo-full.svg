<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">小木屋 LittleWoodHouse</title>
<desc id="desc">温暖的木屋坐落在山林与小路之间，搭配小木屋中文品牌名和 LittleWoodHouse 英文名。</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#79c9ee"/><stop offset="1" stop-color="#b5e8f7"/></linearGradient>
  <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a9bd0"/><stop offset="1" stop-color="#2f78ae"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8a482d"/><stop offset="1" stop-color="#61311f"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d99351"/><stop offset="1" stop-color="#b96d39"/></linearGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8acb5b"/><stop offset="1" stop-color="#5a9f42"/></linearGradient>
  <clipPath id="circle"><circle cx="512" cy="365" r="272"/></clipPath>
</defs>
<!-- circular landscape -->
<circle cx="512" cy="365" r="272" fill="#fff" stroke="#e7f2f4" stroke-width="2"/>
